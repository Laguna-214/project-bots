plugins { id 'com.android.application' }
android {
 namespace 'app.projectbots'
 compileSdk 35
 buildToolsVersion '35.0.0'
 defaultConfig { applicationId 'app.projectbots'; minSdk 29; targetSdk 35; versionCode 2; versionName '0.2.0-native'; testInstrumentationRunner 'app.projectbots.NativeRegressionInstrumentation' }
 signingConfigs { debug { storeFile file(System.getenv('NATIVE_DEBUG_KEYSTORE') ?: "${System.getProperty('user.home')}/.hermes/profiles/project-bot/cache/native-tools/debug.keystore"); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
 buildTypes { debug { debuggable false; signingConfig signingConfigs.debug }; release { minifyEnabled false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
